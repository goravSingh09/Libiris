services:
  - type: web
    name: sblms-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    disk:
      name: sblms-storage
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://sblms.vercel.app
      - key: CORS_ORIGINS
        value: https://sblms.vercel.app,https://sblms-frontend.onrender.com,http://localhost:5173
      - key: STORAGE_FOLDER
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: sblms-postgres
          property: connectionString

  - type: web
    name: sblms-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sblms-backend.onrender.com/api

databases:
  - name: sblms-postgres
    databaseName: sblms
    user: sblms_admin
    plan: free
