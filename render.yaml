services:
  - type: web
    name: libiris-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    disk:
      name: sblms-storage
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://libiris-digital.vercel.app
      - key: CORS_ORIGINS
        value: https://libiris-digital.vercel.app,https://sblms.vercel.app,http://localhost:5173
      - key: STORAGE_FOLDER
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: sblms-postgres
          property: connectionString

databases:
  - name: sblms-postgres
    databaseName: sblms
    user: sblms_admin
    plan: free
